<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 노래</title>
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar-text">
      <h1>내 노래</h1>
      <p id="trackCount">0곡</p>
    </div>
    <button id="addBtn" class="add-fab" aria-label="음악 추가">+</button>
  </header>

  <section class="stage">
    <div class="art" id="art">
      <div class="art-glow"></div>
      <img id="artImg" class="art-img" alt="">
      <div class="art-note" id="artNote">♪</div>
      <div class="yt-holder" id="ytWrap"><div id="ytPlayer"></div></div>
    </div>
    <div class="stage-meta">
      <div id="npTitle" class="np-title">재생 중인 곡 없음</div>
      <div id="npSub" class="np-sub">아래 + 를 눌러 음악을 추가하세요</div>
    </div>
  </section>

  <section class="list-section">
    <div class="list-head">
      <span>재생목록</span>
      <button id="shuffleAllBtn" class="ghost-btn">🔀 셔플</button>
    </div>
    <ul id="playlist" class="playlist"></ul>
    <div id="emptyMsg" class="empty">
      <div class="empty-icon">🎧</div>
      <p>아직 노래가 없어요</p>
      <span>기기 음악 파일, 유튜브 링크, mp3 주소를 넣을 수 있어요</span>
    </div>
  </section>

  <div class="spacer"></div>
</div>


<footer class="player">
  <div class="seek-row">
    <span id="curTime" class="t">0:00</span>
    <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1" aria-label="재생 위치">
    <span id="durTime" class="t">0:00</span>
  </div>

  <div class="ctrl-row">
    <button id="shuffleBtn" class="ctrl" aria-label="셔플">🔀</button>
    <button id="prevBtn" class="ctrl" aria-label="이전 곡">⏮</button>
    <button id="playBtn" class="ctrl play" aria-label="재생">▶</button>
    <button id="nextBtn" class="ctrl" aria-label="다음 곡">⏭</button>
    <button id="repeatBtn" class="ctrl" aria-label="반복">🔁</button>
  </div>

  <div class="vol-row">
    <span class="vol-ico">🔈</span>
    <input type="range" id="volumeBar" min="0" max="1" value="1" step="0.01" aria-label="음량">
  </div>
</footer>


<!-- add sheet -->
<div class="backdrop" id="sheetBackdrop">
  <div class="sheet" id="sheet">
    <div class="handle"></div>
    <h2>음악 추가</h2>
    <button class="sheet-item" data-add="folder">
      <span class="si-ico">🗂️</span>
      <span class="si-text"><b>폴더 통째로</b><i>음악 폴더를 한 번에 전부 가져오기</i></span>
    </button>
    <button class="sheet-item" data-add="file">
      <span class="si-ico">📁</span>
      <span class="si-text"><b>파일 골라서</b><i>mp3 · m4a · flac — 오프라인 재생</i></span>
    </button>
    <button class="sheet-item" data-add="yt">
      <span class="si-ico">▶️</span>
      <span class="si-text"><b>유튜브</b><i>영상 또는 재생목록 통째로</i></span>
    </button>
    <button class="sheet-item" data-add="url">
      <span class="si-ico">🔗</span>
      <span class="si-text"><b>오디오 주소</b><i>mp3 파일 직링크</i></span>
    </button>
  </div>
</div>

<!-- input modal -->
<div class="backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle">추가</h2>
    <input type="text" id="modalName" placeholder="곡 이름 (비워두면 자동)">
    <input type="url" id="modalUrl" placeholder="링크 붙여넣기">
    <p id="modalHint" class="hint"></p>
    <div class="modal-actions">
      <button id="modalCancel" class="ghost-btn wide">취소</button>
      <button id="modalSave" class="prim-btn wide">추가</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="audio/*" multiple hidden>
<input type="file" id="folderInput" webkitdirectory directory multiple hidden>
<audio id="audio" preload="metadata"></audio>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
